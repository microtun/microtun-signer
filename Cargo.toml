[package]
name = "microtun-firmware-signer"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
ed25519-dalek = { version = "2.2", features = ["pkcs8", "pem", "zeroize"] }
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
jsonwebtoken = "9.3.1"
libc = "0.2"
pkcs8 = { version = "0.10.2", features = ["encryption", "pem"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7.5.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["catch-panic", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ulid = "1.1"
zeroize = "1.8"

