# microtun firmware signer - identity/policy example configuration.

[Microtun]
ApiVersion = "microtun.dev/v1alpha1"
Kind = "FirmwareSignerConfig"

[Server]
# Bind the Rust process only to loopback/private networking. Terminate HTTPS/mTLS
# at an internal reverse proxy or load balancer. Public routes are served from the
# domain root (for example /healthz and /v1/sign/{key_id}).
Listen = "127.0.0.1:8080"
# Manual key unlocks use a separate local-only HTTP API over this Unix-domain
# socket. Do not reverse-proxy or expose this socket. The packaged systemd unit
# creates the parent RuntimeDirectory. 0660 allows the service owner/group to
# run the unlock client; adjust group membership according to your operator model.
AdminSocketPath = "/run/microtun-firmware-signer/admin.sock"
AdminSocketMode = 0o660

# This deployment uses one firmware signing key. The key ID is immutable and is
# referenced by the signing URL and authorization policies below.
[[Key]]
ID = "microtun-firmware-prod"
PEMPath = "/etc/microtun-firmware-signer/firmware-signing-key.encrypted.pem"
State = "active"
# No passphrase credential is configured here. Active keys always start locked;
# an operator must run microtun-firmware-signer unlock --key <key-id> after each service start.

# Human identities authenticate through THIS signer's GitHub OAuth App.
# Register an OAuth App in GitHub and set its Authorization callback URL to the
# exact OAuthCallbackURL below. Keep the client secret outside this TOML file;
# the service reads it from a systemd credential (or the documented env/file
# fallback). No GitHub scopes are requested because public account identity is
# enough to resolve the immutable numeric user ID.
[GitHub]
APIURL = "https://api.github.com"
APIVersion = "2026-03-10"
OAuthAuthorizeURL = "https://github.com/login/oauth/authorize"
OAuthAccessTokenURL = "https://github.com/login/oauth/access_token"
OAuthClientID = "Ov23liEXAMPLE"
OAuthClientSecretCredential = "github-oauth-client-secret"
OAuthCallbackURL = "https://signer.example.com/v1/auth/github/callback"
OAuthSessionTTLSeconds = 28800
OAuthStateTTLSeconds = 600

# GitHub Actions OIDC verifier infrastructure. Repository/workflow trust belongs
# to the github-actions Identity below, not to this verifier block.
[GitHubActions]
Audience = "microtun-firmware-signer"
JWKSURL = "https://token.actions.githubusercontent.com/.well-known/jwks"
JWKSTTLSeconds = 3600

# A real GitHub account. GitHubUserID is the authorization anchor; GitHubLogin is
# optional defense-in-depth/readability and can be updated if the account is renamed.
[[Identity]]
ID = "firmware-maintainer"
Type = "github-account"
GitHubUserID = "24681012"
GitHubLogin = "maintainer-login"

# A GitHub Actions identity is anchored to the immutable repository numeric ID.
# Repository is optional, but catches unexpected transfers/renames until config is
# deliberately updated.
[[Identity]]
ID = "microtun-release-actions"
Type = "github-actions"
RepositoryID = "123456789"
Repository = "owner/microtun"

# These repository/workflow claims are part of the identity itself. A token
# that fails them does not authenticate as microtun-release-actions, regardless
# of its RepositoryID. Multiple identities may share a RepositoryID as long as
# their constraints distinguish them (for example release vs nightly workflows).
WorkflowPath = ".github/workflows/release.yml"
AllowedEventNames = ["push"]
AllowedRefTypes = ["tag"]
# Strongly recommended when the release job uses a protected GitHub Environment.
RequiredEnvironment = "firmware-signing"
# Optional: require GitHub-hosted or self-hosted runners.
# RequiredRunnerEnvironment = "self-hosted"
# Optional: pin the release workflow revision(s).
AllowedWorkflowSHAs = []

[[Policy]]
Identity = "firmware-maintainer"
Actions = ["sign"]
Keys = ["microtun-firmware-prod"]

# Release workflow identity: may sign only with the current production key.
[[Policy]]
Identity = "microtun-release-actions"
Actions = ["sign"]
Keys = ["microtun-firmware-prod"]
