name: CI and release

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy

      - name: Check formatting
        run: cargo +1.88.0 fmt --all -- --check

      - name: Check compilation
        run: cargo +1.88.0 check --all-targets --locked

      - name: Run Clippy
        run: cargo +1.88.0 clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo +1.88.0 test --all-targets --locked

  release-gate:
    name: Release gate
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tagged commit is contained in main
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME does not point to a commit contained in main."
            exit 1
          fi

  build-amd64-debs:
    name: Build DEBs (amd64)
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Debian packages
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.debian
          platforms: linux/amd64
          target: debs
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=debs-amd64
          cache-to: type=gha,mode=max,scope=debs-amd64

      - name: Verify packages were built
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f -name '*.deb' -print
          test -n "$(find dist -type f -name '*.deb' -print -quit)"

      - name: Upload Debian packages for release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: debs-amd64
          path: dist/**/*.deb
          if-no-files-found: error

  build-arm64-debs:
    name: Build DEBs (arm64)
    if: startsWith(github.ref, 'refs/tags/')
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Debian packages
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.debian
          platforms: linux/arm64
          target: debs
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=debs-arm64
          cache-to: type=gha,mode=max,scope=debs-arm64

      - name: Verify packages were built
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f -name '*.deb' -print
          test -n "$(find dist -type f -name '*.deb' -print -quit)"

      - name: Upload Debian packages for release
        uses: actions/upload-artifact@v4
        with:
          name: debs-arm64
          path: dist/**/*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-amd64-debs
      - build-arm64-debs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Debian packages
        uses: actions/download-artifact@v4
        with:
          pattern: debs-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t debs < <(find dist -type f -name '*.deb' -print | sort)
          if (( ${#debs[@]} == 0 )); then
            echo "::error::No Debian packages were downloaded."
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" "${debs[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
