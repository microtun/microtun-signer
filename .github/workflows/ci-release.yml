name: CI and release

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy

      - name: Check formatting
        run: cargo +1.98.1 fmt --all -- --check

      - name: Check compilation
        run: cargo +1.98.1 check --all-targets --locked

      - name: Build release binaries
        run: cargo +1.98.1 build --release --locked --bins

      - name: Run Clippy
        run: cargo +1.98.1 clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo +1.98.1 test --all-targets --locked

  release-gate:
    name: Release gate
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag matches package versions
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: scripts/check-release-tag.sh "$GITHUB_REF_NAME"

      - name: Verify tagged commit is contained in main
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME does not point to a commit contained in main."
            exit 1
          fi

  build-amd64-assets:
    name: Build Debian packages (amd64)
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Debian packages
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.debian
          platforms: linux/amd64
          target: debs
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=debs-amd64
          cache-to: type=gha,mode=max,scope=debs-amd64

      - name: Verify Debian packages (amd64)
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f -name '*.deb' -print
          test -n "$(find dist -type f -name '*.deb' -print -quit)"

      - name: Upload Debian packages (amd64)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-debs-amd64
          path: dist/
          if-no-files-found: error

  build-arm64-assets:
    name: Build Debian packages (arm64)
    if: startsWith(github.ref, 'refs/tags/')
    needs: release-gate
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Debian packages
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.debian
          platforms: linux/arm64
          target: debs
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=debs-arm64
          cache-to: type=gha,mode=max,scope=debs-arm64

      - name: Verify Debian packages (arm64)
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f -name '*.deb' -print
          test -n "$(find dist -type f -name '*.deb' -print -quit)"

      - name: Upload Debian packages (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: release-debs-arm64
          path: dist/
          if-no-files-found: error

  build-static-linux:
    name: Build static Linux binary (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/')
    needs: release-gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install musl build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools binutils file

      - name: Install Rust toolchain and musl target
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup +1.98.1 target add ${{ matrix.rust_target }}

      - name: Build static Linux binary
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo +1.98.1 build --release --locked --bin microtun-signer --target ${{ matrix.rust_target }}

      - name: Verify and stage static binary
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.rust_target }}/release/microtun-signer"
          test -s "$binary"
          if readelf -l "$binary" | grep -q INTERP || readelf -d "$binary" | grep -q '(NEEDED)'; then
            echo "::error::Binary contains a dynamic loader or shared library dependency: $binary"
            exit 1
          fi
          mkdir -p dist
          install -m 0755 "$binary" "dist/microtun-signer-linux-${{ matrix.arch }}"
          file "dist/microtun-signer-linux-${{ matrix.arch }}"

      - name: Upload static Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: release-static-linux-${{ matrix.arch }}
          path: dist/microtun-signer-linux-${{ matrix.arch }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-amd64-assets
      - build-arm64-assets
      - build-static-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t debs < <(find dist -type f -name '*.deb' -print | sort)
          if (( ${#debs[@]} == 0 )); then
            echo "::error::No Debian packages were downloaded."
            exit 1
          fi

          binaries=(
            dist/microtun-signer-linux-amd64
            dist/microtun-signer-linux-arm64
          )
          for binary in "${binaries[@]}"; do
            if [[ ! -s "$binary" ]]; then
              echo "::error::Missing standalone binary: $binary"
              exit 1
            fi
          done

          gh release create "$GITHUB_REF_NAME" "${debs[@]}" "${binaries[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
